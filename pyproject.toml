[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ecocash-python"
version = "0.1.0"
description = "Multitenant Python library for the EcoCash Open API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest", "responses", "black", "ruff"]

[tool.ruff]
line-length = 100
